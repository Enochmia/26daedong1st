<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그리핀도르 마법 제어 테스트</title>
  <style>
    /* 기본 초기화 및 폰트 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f4f1ea; /* 따뜻한 양피지 느낌의 배경 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #app {
      width: 100%;
      max-width: 500px;
      height: 100%;
      background-color: #ffffff;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* --- 시작 화면 --- */
    #start-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      background-color: #740001; /* 그리핀도르 레드 */
    }

    .start-btn {
      background-color: #D3A625; /* 그리핀도르 골드 */
      color: #740001;
      border: none;
      border-radius: 20px;
      padding: 15px 50px;
      font-size: 28px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.1s, background-color 0.2s;
    }

    .start-btn:active {
      transform: scale(0.95);
    }

    /* --- 본 화면 --- */
    #game-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 20px;
    }

    /* 상단 헤더 (단계 & 타이머) */
    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 20px;
    }

    .stage-title {
      font-size: 24px;
      font-weight: 700;
      color: #333;
    }

    .timer-box {
      position: absolute;
      right: 0;
      top: -10px;
      border: 3px solid #740001;
      color: #740001;
      padding: 5px 15px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 10px;
      background-color: #fff;
    }

    /* 진행도 표시 (연속 성공 횟수) */
    .progress-text {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #666;
      margin-bottom: 15px;
    }

    /* 문제 출력 박스 */
    .question-box {
      flex: 1;
      border: 4px solid #333;
      border-radius: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin-bottom: 30px;
      background-color: #fafafa;
      text-align: center;
    }

    /* 1단계 텍스트 스타일 */
    .st1-text {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.4;
      color: #111;
    }
    
    .st1-prefix {
      margin-bottom: 20px;
    }
    
    .st1-suffix {
      color: #740001; /* 뒷부분은 색상을 다르게 해 가독성 향상 */
    }

    /* 2단계 텍스트 스타일 */
    .st2-text {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.4;
      color: #111;
      word-break: keep-all;
    }

    /* FIN 및 TIME OVER 텍스트 */
    .fin-text, .over-text {
      font-size: 64px;
      font-weight: 900;
      color: #D3A625;
      text-shadow: 2px 2px 0px #740001;
      display: none;
    }
    .over-text {
      color: #740001;
      text-shadow: none;
    }

    /* 하단 버튼 영역 */
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      height: 100px;
    }

    .ctrl-btn {
      flex: 1;
      border: 4px solid #333;
      border-radius: 20px;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      background-color: #fff;
      transition: background-color 0.1s, transform 0.1s;
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .btn-fail { color: #e53935; }
    .btn-pass { color: #43a047; }
    .btn-reset { color: #555; }

  </style>
</head>
<body>

  <div id="app">
    <!-- 시작 화면 -->
    <div id="start-screen">
      <button class="start-btn" onclick="startGame()">start</button>
    </div>

    <!-- 본 화면 -->
    <div id="game-screen">
      <div class="header">
        <div class="stage-title" id="stage-title">1단계</div>
        <div class="timer-box" id="timer">01:40</div>
      </div>
      
      <div class="progress-text" id="progress-text">성공: 0 / 5</div>

      <div class="question-box">
        <!-- 1단계용 요소 -->
        <div class="st1-text st1-prefix" id="st1-prefix"></div>
        <div class="st1-text st1-suffix" id="st1-suffix"></div>
        
        <!-- 2단계용 요소 -->
        <div class="st2-text" id="st2-text" style="display: none;"></div>
        
        <!-- 종료 메세지 -->
        <div class="fin-text" id="fin-text">FIN</div>
        <div class="over-text" id="over-text">TIME<br>OVER</div>
      </div>

      <div class="controls">
        <button class="ctrl-btn btn-fail" id="btn-fail" onclick="handleFail()">fail</button>
        <button class="ctrl-btn btn-pass" id="btn-pass" onclick="handlePass()">pass</button>
        <button class="ctrl-btn btn-reset" onclick="resetGame()">reset</button>
      </div>
    </div>
  </div>

  <script>
    // === 데이터 영역 ===
    const stage1_questions = [
      { prefix: "익스펙토", suffix: "패트로눔" },
      { prefix: "윙가르디움", suffix: "레비오우사" },
      { prefix: "알로호", suffix: "모라" },
      { prefix: "아바다", suffix: "케다브라" },
      { prefix: "엑스펠리", suffix: "아르무스" },
      { prefix: "리디", suffix: "큘러스" },
      { prefix: "스튜페", suffix: "파이" },
      { prefix: "섹툼", suffix: "셈프라" },
      { prefix: "루모스", suffix: "맥시마" },
      { prefix: "크루시", suffix: "오" },
      { prefix: "그리핀", suffix: "도르" },
      { prefix: "슬리데", suffix: "린" },
      { prefix: "후플", suffix: "푸프" },
      { prefix: "레번", suffix: "클로" },
      { prefix: "호그", suffix: "와트" },
      { prefix: "다이애건", suffix: "앨리" },
      { prefix: "골든", suffix: "스니치" },
      { prefix: "비밀의", suffix: "방" },
      { prefix: "아즈카반의", suffix: "죄수" },
      { prefix: "불의", suffix: "잔" },
      { prefix: "죽음의", suffix: "성물" },
      { prefix: "덤블", suffix: "도어" },
      { prefix: "알버스", suffix: "덤블도어" },
      { prefix: "시리우스", suffix: "블랙" },
      { prefix: "볼드", suffix: "모트" },
      { prefix: "버터", suffix: "맥주" },
      { prefix: "퀴디", suffix: "치" },
      { prefix: "스네", suffix: "이프" },
      { prefix: "해리", suffix: "포터" },
      { prefix: "론", suffix: "위즐리" },
      { prefix: "헤르미", suffix: "온느" },
      { prefix: "헤르미온느", suffix: "그레인저" },
      { prefix: "말포", suffix: "이" },
      { prefix: "드레이코", suffix: "말포이" },
      { prefix: "디멘", suffix: "터" },
      { prefix: "아즈카", suffix: "반" }
    ];

    const stage2_questions = [
      { text: "해리는 왼손 올려!", isActionRequired: true },
      { text: "론은 오른손 내려!", isActionRequired: true },
      { text: "헤르미온느는 양손 다 올려!", isActionRequired: true },
      { text: "해리는 왼손 내리지 마!", isActionRequired: true },
      { text: "론은 오른손 올리지 마!", isActionRequired: true },
      { text: "헤르미온느는 양손 다 내려!", isActionRequired: true },
      { text: "해리는 오른손 올려!", isActionRequired: true },
      { text: "론은 왼손 내려!", isActionRequired: true },
      { text: "해리는 왼손 올리고 오른손 내려!", isActionRequired: true },
      { text: "론은 왼손 내리고 오른손 올려!", isActionRequired: true },
      { text: "헤르미온느는 양손 다 올리고 왼손만 내려!", isActionRequired: true },
      { text: "해리는 오른손 올리고 왼손도 올려!", isActionRequired: true },
      { text: "론은 왼손 올리지 말고 오른손만 올려!", isActionRequired: true },
      { text: "헤르미온느는 오른손 내리지 말고 왼손 내려!", isActionRequired: true },
      { text: "해리는 양손 다 내리고 오른손만 올려!", isActionRequired: true },
      { text: "론은 왼손 내리지 말고 오른손도 내리지 마!", isActionRequired: true },
      { text: "헤르미온느는 오른손 올리고 왼손 내리지 마!", isActionRequired: true },
      { text: "해리는 양손 다 올리지 말고 그대로 있어!", isActionRequired: true },
      { text: "론은 왼손 올리고 오른손 올리지 마!", isActionRequired: true },
      { text: "헤르미온느는 양손 다 내리지 말고 그대로 있어!", isActionRequired: true },
      { text: "왼손 올려!", isActionRequired: false },
      { text: "오른손 내리지 마!", isActionRequired: false },
      { text: "양손 다 올려!", isActionRequired: false },
      { text: "왼손 내리고 오른손 올려!", isActionRequired: false },
      { text: "오른손 올리지 말고 왼손 내려!", isActionRequired: false },
      { text: "양손 다 내리지 말고 그대로 있어!", isActionRequired: false },
      { text: "양손 다 내려!", isActionRequired: false },
      { text: "왼손 올리지 말고 오른손도 올리지 마!", isActionRequired: false },
      { text: "말포이는 왼손 올려!", isActionRequired: false },
      { text: "볼드모트는 오른손 내려!", isActionRequired: false },
      { text: "스네이프는 양손 다 올려!", isActionRequired: false },
      { text: "덤블도어는 왼손 내리지 마!", isActionRequired: false },
      { text: "맥고나걸은 양손 다 내려!", isActionRequired: false },
      { text: "네빌은 왼손 올리고 오른손 내려!", isActionRequired: false },
      { text: "도비는 양손 다 내리지 마!", isActionRequired: false },
      { text: "해그리드는 오른손 올리고 왼손 올려!", isActionRequired: false },
      { text: "시리우스는 왼손 내리고 오른손 올리지 마!", isActionRequired: false },
      { text: "루핀은 양손 다 내리고 오른손만 올려!", isActionRequired: false },
      { text: "벨라트릭스는 왼손 올리지 마!", isActionRequired: false },
      { text: "참가자님 오른손 올려요!", isActionRequired: false }
    ];

    // === 상태 변수 ===
    let currentStage = 1;
    let passCount = 0;
    let timeLeft = 100; // 1분 40초 = 100초
    let timerInterval = null;
    let isGameOver = false;

    // === DOM 요소 ===
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const stageTitle = document.getElementById('stage-title');
    const timerDisplay = document.getElementById('timer');
    const progressText = document.getElementById('progress-text');
    
    const st1Prefix = document.getElementById('st1-prefix');
    const st1Suffix = document.getElementById('st1-suffix');
    const st2Text = document.getElementById('st2-text');
    const finText = document.getElementById('fin-text');
    const overText = document.getElementById('over-text');
    
    const btnFail = document.getElementById('btn-fail');
    const btnPass = document.getElementById('btn-pass');

    // === 게임 로직 ===
    function startGame() {
      startScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
      
      currentStage = 1;
      passCount = 0;
      timeLeft = 100;
      isGameOver = false;
      
      btnFail.disabled = false;
      btnPass.disabled = false;
      finText.style.display = 'none';
      overText.style.display = 'none';
      
      updateUI();
      loadQuestion();
      
      if(timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);
    }

    function resetGame() {
      if(timerInterval) clearInterval(timerInterval);
      startScreen.style.display = 'flex';
      gameScreen.style.display = 'none';
    }

    function updateTimer() {
      if(isGameOver) return;
      
      timeLeft--;
      
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      timerDisplay.innerText = `0${m}:${s < 10 ? '0'+s : s}`;
      
      if(timeLeft <= 0) {
        clearInterval(timerInterval);
        isGameOver = true;
        hideAllQuestions();
        overText.style.display = 'block';
        btnFail.disabled = true;
        btnPass.disabled = true;
        progressText.innerText = "시간 초과!";
      }
    }

    function loadQuestion() {
      hideAllQuestions();
      
      if (currentStage === 1) {
        st1Prefix.style.display = 'block';
        st1Suffix.style.display = 'block';
        let q = stage1_questions[Math.floor(Math.random() * stage1_questions.length)];
        st1Prefix.innerText = q.prefix;
        st1Suffix.innerText = q.suffix;
      } else if (currentStage === 2) {
        st2Text.style.display = 'block';
        let q = stage2_questions[Math.floor(Math.random() * stage2_questions.length)];
        // 진행자 편의를 위해 정답 행동 여부를 컬러로 미세하게 힌트 표시 (선택사항이나 제거함)
        st2Text.innerText = q.text;
      }
    }

    function hideAllQuestions() {
      st1Prefix.style.display = 'none';
      st1Suffix.style.display = 'none';
      st2Text.style.display = 'none';
      finText.style.display = 'none';
      overText.style.display = 'none';
    }

    function updateUI() {
      if (currentStage === 1) {
        stageTitle.innerText = "1단계";
        progressText.innerText = `성공: ${passCount} / 5`;
      } else {
        stageTitle.innerText = "2단계";
        progressText.innerText = `성공: ${passCount} / 7`;
      }
    }

    function handlePass() {
      if(isGameOver) return;
      
      passCount++;
      
      if (currentStage === 1 && passCount === 5) {
        // 2단계로 넘어감
        currentStage = 2;
        passCount = 0;
        updateUI();
        loadQuestion();
      } else if (currentStage === 2 && passCount === 7) {
        // 게임 클리어
        isGameOver = true;
        clearInterval(timerInterval);
        hideAllQuestions();
        finText.style.display = 'block';
        progressText.innerText = "테스트 통과!";
        btnFail.disabled = true;
        btnPass.disabled = true;
      } else {
        updateUI();
        loadQuestion();
      }
    }

    function handleFail() {
      if(isGameOver) return;
      // 실패 시 해당 단계의 카운트를 0으로 초기화
      passCount = 0;
      updateUI();
      loadQuestion();
    }
  </script>
</body>
</html>
