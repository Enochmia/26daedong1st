<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 하단 잘림 및 더블탭 확대 방지 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>그리핀도르 마법 제어 테스트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <!-- 시작 화면 -->
    <div id="start-screen" class="screen flex-center">
      <div class="title-wrap">
        <h1>그리핀도르<br>마법 제어 테스트</h1>
        <p class="subtitle">Gryffindor Logic Control</p>
      </div>
      <button class="start-btn" onclick="startGame()">START</button>
    </div>

    <!-- 본 화면 -->
    <div id="game-screen" class="screen" style="display: none;">
      <header class="header">
        <div class="stage-info">
          <span class="stage-badge" id="stage-title">1단계</span>
          <span class="progress-text" id="progress-text">성공: 0 / 5</span>
        </div>
        <div class="timer-box" id="timer">01:40</div>
      </header>
      
      <main class="question-box">
        <!-- 1단계용 요소 -->
        <div class="st1-text st1-prefix" id="st1-prefix"></div>
        <div class="st1-text st1-suffix" id="st1-suffix"></div>
        
        <!-- 2단계용 요소 -->
        <div class="st2-text" id="st2-text" style="display: none;"></div>
        
        <!-- 종료 메세지 -->
        <div class="result-text fin-text" id="fin-text" style="display: none;">FIN</div>
        <div class="result-text over-text" id="over-text" style="display: none;">TIME<br>OVER</div>
      </main>

      <footer class="controls">
        <button class="ctrl-btn btn-fail" id="btn-fail" onclick="handleFail()">FAIL</button>
        <button class="ctrl-btn btn-pass" id="btn-pass" onclick="handlePass()">PASS</button>
        <button class="ctrl-btn btn-reset" onclick="resetGame()">RESET</button>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
